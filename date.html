<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Will You Go On A Date With Me? 💕</title>
    <meta name="description" content="A cute and romantic way to ask someone on a date!" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            touch-action: manipulation;
            user-select: none;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fbc2eb 0%, #e6a0d0 25%, #c9a0dc 50%, #a18cd1 75%, #8b7dd8 100%);
            background-size: 400% 400%;
            animation: gradShift 12s ease infinite;
            position: relative;
        }

        @keyframes gradShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* ══════ Floating Hearts ══════ */
        .hearts-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .fheart {
            position: absolute;
            bottom: -60px;
            opacity: 0;
            animation: rise linear infinite;
            filter: drop-shadow(0 0 5px rgba(255, 100, 150, 0.35));
        }

        @keyframes rise {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 0;
            }

            8% {
                opacity: 0.85;
            }

            50% {
                opacity: 0.5;
            }

            90% {
                opacity: 0.12;
            }

            100% {
                transform: translateY(-115vh) rotate(360deg) scale(0.25);
                opacity: 0;
            }
        }

        /* ══════ Sparkles ══════ */
        .sparkle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0;
                transform: scale(0);
            }

            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        /* ══════ Glassmorphism Card ══════ */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 28px;
            padding: 50px 44px 42px;
            max-width: 470px;
            width: 90%;
            text-align: center;
            box-shadow:
                0 8px 40px rgba(180, 70, 130, 0.22),
                0 0 80px rgba(200, 120, 200, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            animation: cardIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform: translateY(50px);
            opacity: 0;
        }

        @keyframes cardIn {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .emoji-top {
            font-size: 76px;
            line-height: 1;
            margin-bottom: 6px;
            animation: heartbeat 1.3s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            30% {
                transform: scale(1.14);
            }

            60% {
                transform: scale(1);
            }

            80% {
                transform: scale(1.07);
            }
        }

        .deco {
            font-size: 26px;
            letter-spacing: 6px;
            margin-bottom: 22px;
            animation: fadeUp 0.9s 0.35s both;
        }

        .question {
            font-size: 27px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 14px rgba(0, 0, 0, 0.12);
            margin-bottom: 34px;
            line-height: 1.45;
            animation: fadeUp 0.9s 0.5s both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ══════ Button Row (both buttons start here) ══════ */
        .btn-row {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeUp 0.9s 0.7s both;
        }

        .btn {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 0.4px;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff6b8a, #e8425c, #d63064);
            color: #fff;
            box-shadow: 0 4px 22px rgba(232, 66, 92, 0.5);
            transition: transform 0.25s, box-shadow 0.25s;
        }

        .btn-yes:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 30px rgba(232, 66, 92, 0.65);
        }

        .btn-yes:active {
            transform: scale(1.02);
        }

        /* ══════ No Button — starts inline, escapes to fixed ══════ */
        .btn-no {
            padding: 15px 38px;
            font-size: 18px;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            border: 1.5px solid rgba(255, 255, 255, 0.38);
            border-radius: 50px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(8px);
            color: #fff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            letter-spacing: 0.4px;
            -webkit-tap-highlight-color: transparent;
        }

        /* When escaped: pulled out to fixed positioning */
        .btn-no.escaped {
            position: fixed;
            z-index: 99999;
            transition:
                left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                top 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ══════ Success ══════ */
        .success {
            display: none;
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .success.show {
            display: block;
            animation: popIn 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.6) translateY(30px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .success-heart {
            font-size: 100px;
            animation: heartbeat 1s ease-in-out infinite;
            display: inline-block;
        }

        .success h1 {
            font-size: 38px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 3px 20px rgba(0, 0, 0, 0.14);
            margin: 14px 0 10px;
        }

        .success p {
            font-size: 19px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.92);
            line-height: 1.65;
        }

        .success .parade {
            font-size: 34px;
            letter-spacing: 10px;
            margin-top: 20px;
            animation: fadeUp 0.9s 0.5s both;
        }

        /* ══════ Confetti ══════ */
        .confetti-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 5;
        }

        .confetti {
            position: absolute;
            top: -20px;
            border-radius: 2px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotateZ(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(115vh) rotateZ(720deg);
                opacity: 0;
            }
        }

        /* ══════ Burst ══════ */
        .burst {
            position: fixed;
            pointer-events: none;
            z-index: 6;
            transition: transform 1.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.3s;
        }

        /* ══════ Footer ══════ */
        .footer {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 15px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.68);
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.1);
            letter-spacing: 0.5px;
            animation: fadeUp 1s 1.3s both;
            white-space: nowrap;
        }

        /* ══════ Responsive ══════ */
        @media (max-width: 520px) {
            .card {
                padding: 36px 22px 30px;
                border-radius: 22px;
            }

            .emoji-top {
                font-size: 58px;
            }

            .deco {
                font-size: 20px;
                letter-spacing: 4px;
            }

            .question {
                font-size: 22px;
                margin-bottom: 28px;
            }

            .btn {
                padding: 13px 28px;
                font-size: 16px;
            }

            .btn-no {
                padding: 13px 28px;
                font-size: 16px;
            }

            .success-heart {
                font-size: 74px;
            }

            .success h1 {
                font-size: 28px;
            }

            .success p {
                font-size: 16px;
            }

            .footer {
                font-size: 13px;
                bottom: 12px;
            }
        }

        @media (max-width: 360px) {
            .card {
                padding: 26px 16px 22px;
            }

            .emoji-top {
                font-size: 48px;
            }

            .question {
                font-size: 19px;
            }

            .btn {
                padding: 11px 22px;
                font-size: 15px;
            }

            .btn-no {
                padding: 11px 22px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Background layers -->
    <div class="hearts-layer" id="heartsLayer"></div>
    <div id="sparklesLayer"></div>
    <div class="confetti-layer" id="confettiLayer"></div>

    <!-- ── Ask Card (both buttons start here) ── -->
    <div class="card" id="askCard">
        <div class="emoji-top">💑</div>
        <div class="deco">🌹 ✨ 💌 ✨ 🌹</div>
        <div class="question">Will you go on a date with me? ❤️</div>
        <div class="btn-row">
            <button class="btn btn-yes" id="btnYes">Yes ❤️</button>
            <button class="btn btn-no" id="btnNo">No 😏</button>
        </div>
    </div>

    <!-- ── Success Screen ── -->
    <div class="success" id="successScreen">
        <div class="success-heart">💕</div>
        <h1>YAY! IT'S A DATE! ❤️🥰</h1>
        <p>I knew you'd say yes!<br />Can't wait to see you ✨</p>
        <div class="parade">🥂 🌹 💐 🍫 🎶</div>
    </div>

    <!-- Footer -->
    <div class="footer">Choose wisely… 😌❤️</div>

    <script>
        /* ══════════════════════════════════════════
           CONFIGURATION
        ══════════════════════════════════════════ */
        const ESCAPE_RADIUS = 150;   // px – pointer triggers escape at this distance
        const MIN_YES_DISTANCE = 180;   // px – minimum centre-to-centre from Yes btn
        const MIN_CARD_DISTANCE = 40;   // px – gap from the card edges
        const EDGE_PAD = 14;   // px – padding from viewport edges
        const MAX_ATTEMPTS = 120;  // random position attempts before accepting best

        /* ══════════════════════════════════════════
           ELEMENTS
        ══════════════════════════════════════════ */
        const btnNo = document.getElementById('btnNo');
        const btnYes = document.getElementById('btnYes');
        const askCard = document.getElementById('askCard');
        let dateAccepted = false;
        let hasEscaped = false;  // tracks if the No button has left the card yet

        /* ══════════════════════════════════════════
           HELPERS
        ══════════════════════════════════════════ */
        function centreOf(rect) {
            return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        }

        function dist(ax, ay, bx, by) {
            return Math.hypot(ax - bx, ay - by);
        }

        /** Expand a DOMRect by `pad` px on every side */
        function inflate(rect, pad) {
            return {
                left: rect.left - pad,
                top: rect.top - pad,
                right: rect.right + pad,
                bottom: rect.bottom + pad,
                width: rect.width + pad * 2,
                height: rect.height + pad * 2,
            };
        }

        /** Does rect A overlap rect B? */
        function overlaps(a, b) {
            return !(a.right < b.left || a.left > b.right ||
                a.bottom < b.top || a.top > b.bottom);
        }

        /* ══════════════════════════════════════════
           SAFE POSITION GENERATOR
           Tries up to MAX_ATTEMPTS random spots.
           Each candidate is scored; the best is used.
           A valid position must:
             1. Be fully inside the viewport
             2. Not overlap the card (with padding)
             3. Centre-to-centre ≥ MIN_YES_DISTANCE from Yes btn
        ══════════════════════════════════════════ */
        function findSafePosition() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const nw = btnNo.offsetWidth;
            const nh = btnNo.offsetHeight;

            const yesRect = btnYes.getBoundingClientRect();
            const cardRect = askCard.getBoundingClientRect();

            const yesCentre = centreOf(yesRect);
            const cardZone = inflate(cardRect, MIN_CARD_DISTANCE);

            let bestPos = null;
            let bestScore = -Infinity;

            for (let i = 0; i < MAX_ATTEMPTS; i++) {
                const x = EDGE_PAD + Math.random() * (vw - nw - EDGE_PAD * 2);
                const y = EDGE_PAD + Math.random() * (vh - nh - EDGE_PAD * 2);

                const candidateRect = { left: x, top: y, right: x + nw, bottom: y + nh };
                const candidateCentre = { x: x + nw / 2, y: y + nh / 2 };

                // REJECT: overlaps the card zone
                if (overlaps(candidateRect, cardZone)) continue;

                // REJECT: too close to Yes button centre
                const yesDist = dist(candidateCentre.x, candidateCentre.y, yesCentre.x, yesCentre.y);
                if (yesDist < MIN_YES_DISTANCE) continue;

                // SCORE: prefer positions far from Yes and away from screen corners
                const cornerDist = Math.min(
                    dist(candidateCentre.x, candidateCentre.y, 0, 0),
                    dist(candidateCentre.x, candidateCentre.y, vw, 0),
                    dist(candidateCentre.x, candidateCentre.y, 0, vh),
                    dist(candidateCentre.x, candidateCentre.y, vw, vh)
                );
                const score = yesDist + cornerDist * 0.3 + Math.random() * 60;

                if (score > bestScore) {
                    bestScore = score;
                    bestPos = { x, y };
                }
            }

            // Fallback: if somehow nothing passed, put it bottom-right
            if (!bestPos) {
                bestPos = { x: vw - nw - EDGE_PAD, y: vh - nh - EDGE_PAD - 50 };
            }

            return bestPos;
        }

        /* ══════════════════════════════════════════
           ESCAPE: pull No button out of the card
           on first approach, then reposition it.
        ══════════════════════════════════════════ */
        function escapeNoButton() {
            if (dateAccepted) return;

            if (!hasEscaped) {
                // First escape: pull it out of the normal flow
                // Move it to the body root so position:fixed works cleanly
                hasEscaped = true;
                document.body.appendChild(btnNo);
                btnNo.classList.add('escaped');
            }

            const pos = findSafePosition();
            btnNo.style.left = pos.x + 'px';
            btnNo.style.top = pos.y + 'px';
        }

        // Reposition on resize so it stays in viewport (only if already escaped)
        window.addEventListener('resize', () => {
            if (!dateAccepted && hasEscaped) {
                const pos = findSafePosition();
                btnNo.style.left = pos.x + 'px';
                btnNo.style.top = pos.y + 'px';
            }
        });

        /* ══════════════════════════════════════════
           POINTER TRACKING — move BEFORE click
           Uses both pointermove (unified) and
           mousemove (desktop fallback) to cover
           every browser scenario.
        ══════════════════════════════════════════ */
        function handlePointerProximity(px, py) {
            if (dateAccepted) return;
            const rect = btnNo.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            if (dist(px, py, cx, cy) < ESCAPE_RADIUS) {
                escapeNoButton();
            }
        }

        document.addEventListener('pointermove', (e) => {
            handlePointerProximity(e.clientX, e.clientY);
        });

        document.addEventListener('mousemove', (e) => {
            handlePointerProximity(e.clientX, e.clientY);
        });

        // ── Direct interaction guards ──
        btnNo.addEventListener('pointerdown', (e) => { e.preventDefault(); escapeNoButton(); });
        btnNo.addEventListener('pointerenter', (e) => { e.preventDefault(); escapeNoButton(); });
        btnNo.addEventListener('touchstart', (e) => { e.preventDefault(); escapeNoButton(); }, { passive: false });
        btnNo.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); escapeNoButton(); });

        /* ══════════════════════════════════════════
           YES BUTTON → SUCCESS
        ══════════════════════════════════════════ */
        btnYes.addEventListener('click', () => {
            dateAccepted = true;
            askCard.style.display = 'none';
            btnNo.style.display = 'none';
            document.getElementById('successScreen').classList.add('show');
            fireConfetti();
            burstHearts();
        });

        /* ══════════════════════════════════════════
           FLOATING HEARTS BACKGROUND
        ══════════════════════════════════════════ */
        const heartsLayer = document.getElementById('heartsLayer');
        const heartSet = ['❤️', '💕', '💗', '💖', '💘', '🩷', '🤍', '♥️'];

        function spawnHeart() {
            const h = document.createElement('span');
            h.className = 'fheart';
            h.textContent = heartSet[Math.random() * heartSet.length | 0];
            h.style.left = Math.random() * 100 + '%';
            h.style.fontSize = (18 + Math.random() * 28) + 'px';
            const dur = 7 + Math.random() * 8;
            h.style.animationDuration = dur + 's';
            h.style.animationDelay = (Math.random() * 2) + 's';
            heartsLayer.appendChild(h);
            setTimeout(() => h.remove(), (dur + 3) * 1000);
        }
        for (let i = 0; i < 14; i++) setTimeout(spawnHeart, i * 280);
        setInterval(spawnHeart, 1100);

        /* ══════════════════════════════════════════
           SPARKLES
        ══════════════════════════════════════════ */
        const sparklesLayer = document.getElementById('sparklesLayer');
        function spawnSparkle() {
            const s = document.createElement('div');
            s.className = 'sparkle';
            s.style.left = Math.random() * 100 + 'vw';
            s.style.top = Math.random() * 100 + 'vh';
            s.style.animationDelay = (Math.random() * 3) + 's';
            s.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
            sparklesLayer.appendChild(s);
            setTimeout(() => s.remove(), 7000);
        }
        for (let i = 0; i < 22; i++) setTimeout(spawnSparkle, i * 140);
        setInterval(spawnSparkle, 550);

        /* ══════════════════════════════════════════
           CONFETTI
        ══════════════════════════════════════════ */
        function fireConfetti() {
            const box = document.getElementById('confettiLayer');
            const colors = ['#ff6b8a', '#ffd166', '#a18cd1', '#fbc2eb', '#ff8fab',
                '#e8425c', '#c9b1ff', '#ff70a6', '#fff', '#ffa0c4'];

            function wave(n, gap) {
                for (let i = 0; i < n; i++) {
                    setTimeout(() => {
                        const p = document.createElement('div');
                        p.className = 'confetti';
                        p.style.left = Math.random() * 100 + '%';
                        p.style.background = colors[Math.random() * colors.length | 0];
                        const sz = 6 + Math.random() * 10;
                        p.style.width = sz + 'px'; p.style.height = sz + 'px';
                        p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                        const dur = 1.6 + Math.random() * 2.4;
                        p.style.animationDuration = dur + 's';
                        box.appendChild(p);
                        setTimeout(() => p.remove(), dur * 1000 + 300);
                    }, i * gap);
                }
            }
            wave(130, 25);
            setTimeout(() => wave(70, 35), 1400);
        }

        /* ══════════════════════════════════════════
           BURST HEARTS
        ══════════════════════════════════════════ */
        function burstHearts() {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const emojis = ['❤️', '💕', '💖', '💗', '💘', '🥰', '😍', '💐', '🌹', '✨'];

            for (let i = 0; i < 28; i++) {
                setTimeout(() => {
                    const el = document.createElement('span');
                    el.className = 'burst';
                    el.textContent = emojis[Math.random() * emojis.length | 0];
                    el.style.fontSize = (22 + Math.random() * 22) + 'px';
                    el.style.left = cx + 'px';
                    el.style.top = cy + 'px';

                    const angle = Math.random() * Math.PI * 2;
                    const r = 120 + Math.random() * 240;
                    const tx = Math.cos(angle) * r;
                    const ty = Math.sin(angle) * r - 50;

                    document.body.appendChild(el);
                    requestAnimationFrame(() => {
                        el.style.transform = `translate(${tx}px, ${ty}px) scale(1.3)`;
                        el.style.opacity = '0';
                    });
                    setTimeout(() => el.remove(), 1500);
                }, i * 70);
            }
        }
    </script>
</body>

</html>
